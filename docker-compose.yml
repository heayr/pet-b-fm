services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ACCESS_KEY_WEB_FORM: ${NEXT_PUBLIC_ACCESS_KEY_WEB_FORM:-}
    platform: linux/amd64
    command: sh -c "npx prisma migrate deploy && npm start"
    container_name: radiotochka-web
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://petbuser:petbpassword@db:5432/petbfmdb?schema=public
      - NEXTAUTH_URL=https://radiotochka.nologs.site
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - AUTH_TRUST_HOST=true
      - NEXT_PUBLIC_ACCESS_KEY_WEB_FORM=${NEXT_PUBLIC_ACCESS_KEY_WEB_FORM:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radiotochka.rule=Host(`radiotochka.nologs.site`)"
      - "traefik.http.routers.radiotochka.entrypoints=websecure"
      - "traefik.http.routers.radiotochka.tls=true"
      - "traefik.http.routers.radiotochka.tls.certresolver=letsencrypt"
      - "traefik.http.services.radiotochka.loadbalancer.server.port=3000"

  db:
    image: postgres:16-alpine
    container_name: radiotochka-db
    environment:
      POSTGRES_USER: petbuser
      POSTGRES_PASSWORD: petbpassword
      POSTGRES_DB: petbfmdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petbuser -d petbfmdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - proxy

volumes:
  pgdata:

networks:
  proxy:
    external: true
